  #     - 'host.docker.internal:host-gateway'
  #   volumes:
  #     - '/dev/shm:/dev/shm'
  #   networks:
  #     - sneat-project_default

  # mailpit:
  #   image: 'axllent/mailpit:latest'
  #   container_name: mailpit
  #   ports:
  #     - '${FORWARD_MAILPIT_PORT:-1025}:1025'
  #     - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
  #   networks:
  #     - sneat-project_default

networks:
  sneat-project_default:
    driver: bridge

volumes:
